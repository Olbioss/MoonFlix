# Render Blueprint: deploys the API as a Node web service and the client as
# a static site. Create via dashboard.render.com -> New -> Blueprint.
# The two sync:false secrets (MONGODB_URL, TMDB_KEY) are prompted for on
# blueprint creation; TOKEN_SECRET is generated by Render.
services:
  # API — Node web service
  - type: web
    name: moonflix-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node index.js
    envVars:
      - key: MONGODB_URL
        sync: false
      - key: TMDB_KEY
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: TMDB_BASE_URL
        value: https://api.themoviedb.org/3/
      # Must match the static site's final URL — fix here if Render had to
      # suffix the subdomain because the name was taken.
      - key: CORS_ORIGINS
        value: https://moonflix.onrender.com

  # Client — static site
  - type: web
    runtime: static
    name: moonflix
    rootDir: client
    # --prod=false: Render sets NODE_ENV=production, which would skip the
    # devDependencies that hold Vite and TypeScript.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    staticPublishPath: dist
    routes:
      # SPA fallback so deep links like /movie/123 resolve to the app.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked into the bundle at build time. Must match the API's final URL —
      # if the subdomain got suffixed, fix this and redeploy the client.
      - key: VITE_API_BASE_URL
        value: https://moonflix-api.onrender.com/api/v1/
